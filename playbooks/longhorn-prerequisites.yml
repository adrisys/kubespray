---
- name: Fix Longhorn prerequisites
  hosts: kube_node
  tasks:

    - name: Ensure iscsi_tcp kernel module is loaded
      ansible.builtin.modprobe:
        name: iscsi_tcp
        state: present

    - name: Ensure iscsi_tcp module is persistent
      ansible.builtin.lineinfile:
        path: /etc/modules
        line: iscsi_tcp
        state: present

    - name: Stop multipathd if running
      ansible.builtin.service:
        name: multipathd
        state: stopped
        enabled: no

    - name: Install nfs-common (Ubuntu/Debian)
      ansible.builtin.apt:
        name: nfs-common
        state: present
      when: ansible_facts['os_family'] == 'Debian'

    - name: Install nfs-utils (CentOS/RHEL)
      ansible.builtin.yum:
        name: nfs-utils
        state: present
      when: ansible_facts['os_family'] == 'RedHat'